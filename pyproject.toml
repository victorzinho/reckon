[project]
name = "reckon"
version = "0.1.0rc2"
description = "Specs and their audits, for spec-driven development"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Víctor González", email = "victor@victorzinho.es" }]
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/victorzinho/reckon"
Issues = "https://github.com/victorzinho/reckon/issues"

[project.scripts]
reckon = "reckon.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "import-linter>=2.16",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-jsonschema>=4.25",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
preview = true

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
pythonpath = ["."]

[tool.coverage.run]
source = ["reckon"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "reckon"

[[tool.importlinter.contracts]]
name = "Layers: cli -> services -> store"
type = "layers"
containers = ["reckon"]
layers = ["cli", "services", "store"]
exhaustive = true
